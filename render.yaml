# Render.com blueprint — one-click deploy of the public read-only desk.
# How to use:
#   1. Push this repo to GitHub.
#   2. On render.com → New → Blueprint → pick your repo. Render reads this file.
#   3. Click Apply. You get a public https://<name>.onrender.com URL.
# Free plan: the service sleeps when idle and wakes on the next visit (~30s).
# Storage is ephemeral on the free plan — that's fine: the desk re-seeds demo
# data and re-ingests live feeds automatically.
services:
  - type: web
    name: gsid
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GSID_ENV
        value: production
      # live = only real ingested feeds (no demo fixtures mixed into news)
      - key: GSID_DATA_MODE
        value: live
      - key: GSID_INGEST_EVERY_HOURS
        value: "24"
      - key: GSID_INGEST_INTERVAL_MINUTES
        value: "15"
      # Public read-only: anyone can view + refresh; editing needs the admin token.
      - key: GSID_PUBLIC_READONLY
        value: "true"
      - key: GSID_PUBLIC_ALLOW_REFRESH
        value: "true"
      # Secrets are auto-generated by Render (you never see or commit them).
      - key: GSID_SECRET_KEY
        generateValue: true
      - key: GSID_ADMIN_TOKEN
        generateValue: true
